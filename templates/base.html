{% from "_macros.html" import brand, credits with context %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}windroute{% endblock %}</title>
  <meta name="description" content="Wind-aware cycling routes: ride out into the headwind while you're fresh, home with the tailwind.">
  <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f15" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}page{% endblock %}">
{% block body %}
  <header class="topbar">
    <div class="topbar-inner">
      {{ brand() }}
      <a class="btn sm" href="/">Plan a ride</a>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="credits">{{ credits() }}</footer>
{% endblock %}
</body>
</html>
